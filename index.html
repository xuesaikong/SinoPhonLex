<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>中法词汇查询</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>中法谐音匹配查询</h1>
        <p class="subtitle">输入中文谐音或拼音，找到对应的法语单词</p>
      </header>

      <div class="search-section">
        <div class="input-group">
          <input
            type="text"
            id="searchInput"
            placeholder="输入中文或拼音..."
            autocomplete="off"
          />
          <button id="searchBtn">搜索</button>
        </div>
        <div id="loadingIndicator" class="hidden"></div>
          <span>脑波正在连接...</span>
      </div>
      </div>

      <div class="content-section">
        <div id="candidatesContainer" class="hidden">
          <h3>可能的候选单词：</h3>
          <ul id="candidatesList" class="candidates-list"></ul>
        </div>
        
        <div id="wordInfoCard" class="word-info-card hidden">
          <div class="card-header">
            <h2 id="wordTitle">bonjour</h2>
            <span id="wordPronunciation" class="pronunciation">/bɔ̃ʒuʁ/</span>
          </div>
          <div class="card-body">
            <div class="info-group">
              <span class="label">中文意思：</span>
              <p id="wordMeaning">你好，早上好</p>
            </div>
            <div class="info-group sentences-group">
              <span class="label">例句：</span>
              <div id="wordSentences" class="sentences-list"></div>
            </div>
          </div>
          <div id="wordLoading" class="hidden word-loading">
            <span>生成词条信息中...</span>
          </div>
        </div>
      </div>
    </div>

    <script src="/static/script.js"></script>
  </body>
</html>
