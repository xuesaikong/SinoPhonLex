<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>中法谐音词汇查询系统</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="background-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
    </div>

    <div class="container glass-card">
      <header>
        <h1>🇫🇷 中法谐音匹配查询 🐼</h1>
        <p class="subtitle">输入中文谐音或拼音，快速找到地道的法语单词</p>
      </header>

      <div class="search-section">
        <div class="input-group">
          <input
            type="text"
            id="searchInput"
            placeholder="例: 笨猪, 麦西, ben zhu"
            autocomplete="off"
          />
          <button id="searchBtn">搜索</button>
        </div>
        <div id="loadingIndicator" class="hidden">
          <div class="spinner"></div>
          <span>脑波正在连接...</span>
        </div>
      </div>

      <div class="content-section">
        <div id="candidatesContainer" class="hidden">
          <h3>可能的候选单词：</h3>
          <ul id="candidatesList" class="candidates-list"></ul>
        </div>

        <div id="wordInfoCard" class="word-info-card glass-card hidden">
          <div class="card-header">
            <h2 id="wordTitle">bonjour</h2>
            <span id="wordPronunciation" class="pronunciation">/bɔ̃ʒuʁ/</span>
          </div>
          <div class="card-body">
            <div class="info-group">
              <span class="label">中文意思：</span>
              <p id="wordMeaning">你好，早上好</p>
            </div>
            <div class="info-group sentences-group">
              <span class="label">例句：</span>
              <div id="wordSentences" class="sentences-list"></div>
            </div>
          </div>
          <div id="wordLoading" class="hidden word-loading">
            <div class="spinner small"></div>
            <span>生成词条信息中...</span>
          </div>
        </div>
      </div>

      <!-- 设置触发按钮 -->
      <button id="settingsBtn" class="settings-btn" title="Settings">⚙️</button>
    </div>

    <!-- 设置弹窗 -->
    <div id="settingsModal" class="modal hidden glass-card">
      <div class="modal-content">
        <h3>⚙️ 系统设置</h3>
        <div class="input-group">
          <label for="apiKeyInput">DeepSeek API Key (可选)</label>
          <input type="password" id="apiKeyInput" placeholder="sk-..." />
        </div>
        <p class="hint">
          配置您自己的 DeepSeek API Key
          后词条生成速度更快，如果留空将使用默认服务器配置。
        </p>
        <div class="modal-actions">
          <button id="saveSettingsBtn" class="btn primary">保存</button>
          <button id="closeSettingsBtn" class="btn secondary">取消</button>
        </div>
      </div>
    </div>

    <script src="/static/script.js"></script>
  </body>
</html>
